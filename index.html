<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to My Website</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: lightblue;
            font-family: Cambria, serif;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            width: 80%;
        }

        h1 {
            color: blue;
        }

        /* Scrolling Text */
        .scroll-box {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            border: 2px solid blue;
            padding: 10px 0;
            margin: 20px 0;
            background: white;
        }

        .scroll-text {
            display: inline-block;
            color: blue;
            font-weight: bold;
            animation: scroll 10s linear infinite;
        }

        @keyframes scroll {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(-100%);
            }
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px auto;
        }

        .box {
            background-color: white;
            border: 2px solid blue;
            padding: 20px;
            color: blue;
            font-weight: bold;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-family: Cambria, serif;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Welcome to My Website</h1>

    <div class="scroll-box">
        <div class="scroll-text">
            Welcome! This is a simple CSS scrolling text demonstration.
        </div>
    </div>

    <div class="grid-container">
        <div class="box">Home</div>
        <div class="box">About</div>
        <div class="box">Services</div>
        <div class="box">Gallery</div>
        <div class="box">Projects</div>
        <div class="box">Contact</div>
    </div>

    <button>Click Here</button>

</div>

</body>
</html>
